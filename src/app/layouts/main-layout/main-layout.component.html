
<mat-sidenav-container class="sidenav-container">
  <!-- Sidebar Navigation -->
  <mat-sidenav 
    #drawer 
    class="sidenav" 
    fixedInViewport
    [attr.role]="isHandset ? 'dialog' : 'navigation'"
    [mode]="isHandset ? 'over' : 'side'"
    [opened]="!isHandset"
    [autoFocus]="false">
    
    <div class="sidenav-header">
      <div class="logo">
        <mat-icon class="logo-icon">medical_services</mat-icon>
        <span class="logo-text">Crohnnected</span>
      </div>
      
      <div class="user-info" *ngIf="currentUser">
        <div class="user-avatar">
          <mat-icon>account_circle</mat-icon>
        </div>
        <div class="user-details">
          <span class="user-name">{{ getUserDisplayName() }}</span>
          <span class="user-role">{{ getUserRole() }}</span>
        </div>
      </div>
    </div>

    <mat-nav-list class="nav-list">
      <a 
        mat-list-item 
        *ngFor="let item of getVisibleNavigationItems()" 
        [routerLink]="item.route"
        routerLinkActive="active-nav-item"
        [attr.aria-label]="item.label">
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
    </mat-nav-list>

    <div class="sidenav-footer">
      <button 
        mat-list-item 
        (click)="onLogout()"
        class="logout-button"
        aria-label="Sign out">
        <mat-icon matListItemIcon>exit_to_app</mat-icon>
        <span matListItemTitle>Sign Out</span>
      </button>
    </div>
  </mat-sidenav>

  <!-- Main Content Area -->
  <mat-sidenav-content class="main-content">
    <!-- Top Toolbar -->
    <mat-toolbar color="primary" class="toolbar">
      <button
        type="button"
        aria-label="Toggle sidenav"
        mat-icon-button
        (click)="drawer.toggle()"
        *ngIf="isHandset">
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>

      <span class="toolbar-spacer"></span>

      <!-- User Menu (Desktop) -->
      <div class="user-menu" *ngIf="!isHandset && currentUser">
        <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-trigger">
          <mat-icon class="user-icon">account_circle</mat-icon>
          <span class="user-name-desktop">{{ getUserDisplayName() }}</span>
          <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
        </button>
        
        <mat-menu #userMenu="matMenu" xPosition="before">
          <button mat-menu-item routerLink="/profile">
            <mat-icon>person</mat-icon>
            <span>Profile</span>
          </button>
          <button mat-menu-item routerLink="/settings">
            <mat-icon>settings</mat-icon>
            <span>Settings</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="onLogout()">
            <mat-icon>exit_to_app</mat-icon>
            <span>Sign Out</span>
          </button>
        </mat-menu>
      </div>

      <!-- Mobile User Menu -->
      <button 
        mat-icon-button
        [matMenuTriggerFor]="mobileUserMenu"
        *ngIf="isHandset && currentUser"
        aria-label="User menu">
        <mat-icon>account_circle</mat-icon>
      </button>
      
      <mat-menu #mobileUserMenu="matMenu" xPosition="before">
        <div class="mobile-user-info">
          <span class="mobile-user-name">{{ getUserDisplayName() }}</span>
          <span class="mobile-user-role">{{ getUserRole() }}</span>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item routerLink="/profile">
          <mat-icon>person</mat-icon>
          <span>Profile</span>
        </button>
        <button mat-menu-item routerLink="/settings">
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="onLogout()">
          <mat-icon>exit_to_app</mat-icon>
          <span>Sign Out</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <!-- Page Content -->
    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
