name: AWS Deploy CI/CD

on:
  push:
    branches:
      - main         # deploy automático em pushes na main
  workflow_dispatch:   # permite execução manual para migrations/seeds

jobs:
  # =======================
  # 1️⃣ Migrations & Seeds
  # =======================
  prisma-setup:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'  # só roda manualmente
    steps:
      - name: Build Docker Image
        run: docker build -t hartungvictor/crohnnected
      - name: Login to Docker
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - name: Push Docker Image
        run: docker push hartungvictor/crohnnected:latest

      - name: 🔹 Checkout código
        uses: actions/checkout@v4

      - name: 🔹 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Install dependencies
        run: npm ci

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:5432/${{ secrets.DB_NAME }}

      - name: Run Prisma Seed
        run: npx prisma db seed
        env:
          DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:5432/${{ secrets.DB_NAME }}

  # =======================
  # 2️⃣ Build & Deploy App
  # =======================
  deploy-app:
    runs-on: ubuntu-latest
    needs: prisma-setup   # espera que o job de migrations/seeds termine
    steps:
      - name: Pull Image from Docker Hub
        run: docker pull hartungvictor/crohnnected:latest
      - name: Delete old Container
        run: docker rm -f crohnnected-container
      - name: Run Container
        run: docker run -d -p 3000:3000 --name crohnnected-container hartungvictor/crohnnected:latest

      - name: 🔹 Checkout código
        uses: actions/checkout@v4

      - name: 🔹 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Install dependencies
        run: npm ci

  

      - name: 🧱 Build project
        run: npm run build

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: 🚀 Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
     